plugins { id 'com.android.application' }

def productVersion = file('../../../internal/version/VERSION').text.trim()
def buildNumber = providers.gradleProperty('fncpnBuild').orElse('1').get().toInteger()
def existingNdk = System.getenv('ANDROID_NDK_HOME')
if (!existingNdk) throw new GradleException('Set ANDROID_NDK_HOME to the existing pinned NDK; automatic installation is disabled')
if (gradle.gradleVersion != '8.13') throw new GradleException('Use the already installed Gradle 8.13')
if (JavaVersion.current() != JavaVersion.VERSION_17) throw new GradleException('Use the already installed JDK 17')

// Local builds load the private file outside the checkout. CI supplies env vars.
// Never fall back to AGP's generated debug keystore.
def credentialFile = new File(System.getenv('FNCPN_SIGNING_CREDENTIALS') ?: "${System.getProperty('user.home')}/.android/keystores/fncpn-release.credentials.json")
def localSigning = credentialFile.isFile() ? new groovy.json.JsonSlurper().parse(credentialFile) : [:]
def signingPath = System.getenv('FNCPN_KEYSTORE') ?: localSigning.keystore
def signingStorePassword = System.getenv('FNCPN_STORE_PASSWORD') ?: localSigning.store_password
def signingAlias = System.getenv('FNCPN_KEY_ALIAS') ?: localSigning.alias
def signingKeyPassword = System.getenv('FNCPN_KEY_PASSWORD') ?: localSigning.key_password
if (!signingPath || !signingStorePassword || !signingAlias || !signingKeyPassword || !new File(signingPath.toString()).isFile()) {
    throw new GradleException('FnCPN signing key is required for every build; configure signing credentials outside the repository')
}

android {
    namespace 'com.rectcircle.fncpn'
    compileSdk 36
    buildToolsVersion '35.0.0'
    ndkVersion '28.2.13676358'
    ndkPath existingNdk
    defaultConfig {
        applicationId 'com.rectcircle.fncpn'
        manifestPlaceholders = [appLabel: 'FnCPN']
        testInstrumentationRunner 'com.rectcircle.fncpn.SmokeInstrumentation'
        minSdk 26
        targetSdk 36
        versionCode buildNumber
        versionName productVersion
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main {
        java.srcDir layout.buildDirectory.dir('generated/fyne/java')
        jniLibs.srcDir layout.buildDirectory.dir('generated/go/jniLibs')
        assets.srcDir layout.buildDirectory.dir('generated/fyne/assets')
    }
    buildTypes {
        debug {
            applicationIdSuffix providers.gradleProperty('fncpnDev').isPresent() ? '.dev' : '.debug'
            if (providers.gradleProperty('fncpnDev').isPresent()) manifestPlaceholders = [appLabel: 'FnCPN 开发版']
        }
        release { minifyEnabled false }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
    signingConfigs {
        release {
            storeFile file(signingPath)
            storePassword signingStorePassword
            keyAlias signingAlias
            keyPassword signingKeyPassword
        }
    }
    buildTypes.debug.signingConfig signingConfigs.release
    buildTypes.release.signingConfig signingConfigs.release

}

tasks.register('prepareGo', Exec) {
    workingDir file('../../..')
    commandLine 'python3', 'scripts/android/prepare.py'
    doLast {
        def path = layout.buildDirectory.file('generated/fyne/assets/build.json').get().asFile
        def metadata = new groovy.json.JsonSlurper().parse(path)
        metadata.gradle = gradle.gradleVersion
        metadata.java = System.getProperty('java.version')
        metadata.agp = '8.13.2'
        metadata.sdk = 36
        metadata.versionCode = buildNumber
        path.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + '\n'
    }
    // Go's content-addressed build cache handles incremental native builds.
    // Run preparation on every Gradle invocation so source changes cannot be missed.
}
tasks.named('preBuild').configure { dependsOn 'prepareGo' }

tasks.configureEach {
    if (name == 'packageRelease' || name == 'bundleRelease') {
        doFirst {
            if (!providers.gradleProperty('fncpnBuild').isPresent()) throw new GradleException('Release requires an explicit increasing fncpnBuild')
            if (!signingPath) throw new GradleException('Release requires the configured FnCPN signing key')
            def metadata = new groovy.json.JsonSlurper().parse(layout.buildDirectory.file('generated/fyne/assets/build.json').get().asFile)
            if (metadata.dirty) throw new GradleException('Release requires a clean source tree')
        }
    }
}
