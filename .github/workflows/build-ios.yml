name: iOS
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.0.app/Contents/Developer
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            go.sum
            mobile/go.sum
      - name: Verify candidate
        if: ${{ inputs.version != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.ref }}
        run: python3 scripts/check-release-candidate.py
      - name: Check iOS overlays and release inventory
        run: |
          python3 -m unittest discover -s scripts/ios -p '*_test.py'
          python3 scripts/ios_release_test.py
      - name: Mobile regression checks
        working-directory: mobile
        run: |
          go test -tags ci ./...
          go test -race -tags ci ./...
          go vet -tags ci ./...
      - name: Build unsigned device Release IPA
        run: bash scripts/package-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-candidates-${{ inputs.ref || github.sha }}
          path: dist/ios/
          if-no-files-found: error
