name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Product version for release candidates
        type: string
        required: false
      ref:
        type: string
        required: true
      release:
        type: boolean
        default: false
    secrets:
      FNCPN_KEYSTORE_BASE64:
        required: true
      FNCPN_STORE_PASSWORD:
        required: true
      FNCPN_KEY_ALIAS:
        required: true
      FNCPN_KEY_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Mobile Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            go.sum
            mobile/go.sum
      - name: Shared client lifecycle tests
        run: go test -race ./internal/client ./internal/clienthost
      - name: Mobile tests and static checks
        working-directory: mobile
        run: |
          go test -race -tags ci,no_emoji,migrated_fynedo ./...
          go vet -tags ci,no_emoji,migrated_fynedo ./...
      - name: Android packaging regression checks
        run: python3 -m unittest discover -s scripts/android -p '*_test.py'

  build:
    name: Signed Release APK (arm64 and x86_64)
    # Automatic events run checks; signed artifacts are built on explicit dispatch
    # (including the reusable release workflow), never from PR code.
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_NDK_VERSION: '28.2.13676358'
      ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            go.sum
            mobile/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358'
      - name: Select pinned NDK on runner
        run: |
          test -n "$ANDROID_HOME"
          test -f "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/source.properties"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Download pinned Go module dependencies
        working-directory: mobile
        run: go mod download
      - name: Verify release source and select build number
        env:
          RELEASE_BUILD: ${{ inputs.release || false }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.ref }}
        run: |
          if [[ "$RELEASE_BUILD" == true ]]; then
            python3 scripts/check-release-candidate.py
            test -z "$(git status --porcelain)"
          fi
          echo "FNCPN_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - name: Restore application signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FNCPN_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'FnCPN signing secret is required'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fncpn-release.jks"
          echo "FNCPN_KEYSTORE=$RUNNER_TEMP/fncpn-release.jks" >> "$GITHUB_ENV"
      - name: Compile Java, JNI and both Go libraries; package signed Release APK
        env:
          FNCPN_STORE_PASSWORD: ${{ secrets.FNCPN_STORE_PASSWORD }}
          FNCPN_KEY_ALIAS: ${{ secrets.FNCPN_KEY_ALIAS }}
          FNCPN_KEY_PASSWORD: ${{ secrets.FNCPN_KEY_PASSWORD }}
        working-directory: mobile/android
        run: |
          gradle --no-daemon --console=plain --stacktrace clean :app:assembleRelease \
            "-PfncpnBuild=$FNCPN_BUILD" 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Verify APK, JNI exports, versions and pinned application signature
        run: |
          for abi in arm64-v8a x86_64; do
            python3 scripts/android/verify_apk.py \
              "mobile/android/app/build/outputs/apk/release/app-$abi-release.apk" \
              --abi "$abi" --build-number "$FNCPN_BUILD" --release \
              --output "$RUNNER_TEMP/android-artifacts"
          done 2>&1 | tee "$RUNNER_TEMP/android-verification.log"
      - name: Upload installable signed Release APK and verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release && format('android-release-candidates-{0}', inputs.ref) || format('fncpn-android-release-{0}-{1}', github.run_number, github.run_attempt) }}
          path: ${{ runner.temp }}/android-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/fncpn-release.jks"
      - name: Upload logs and build reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fncpn-android-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-build.log
            ${{ runner.temp }}/android-verification.log
            mobile/android/app/build/reports/
            mobile/android/app/build/outputs/logs/
            mobile/android/app/build/generated/fyne/assets/build.json
          if-no-files-found: warn
          retention-days: 14
