name: Build LoongArch RPM and Arch
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      version:
        type: string
        default: ''
      release:
        type: boolean
        default: false
      runtime_validation:
        type: boolean
        default: false
    secrets:
      RPM_SIGNING_PRIVATE_KEY:
        required: false
      RPM_SIGNING_PASSPHRASE:
        required: false
  workflow_dispatch:
    inputs:
      target:
        description: Candidate package format
        type: choice
        options: [both, rpm, archlinux]
        default: both
      version:
        type: string
        default: ''
      release:
        type: boolean
        default: false
      runtime_validation:
        type: boolean
        default: true
      ref:
        description: Source branch or commit (validation only)
        type: string
        default: main
permissions:
  contents: read
concurrency:
  group: loongarch-formats-${{ inputs.target }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: targets
        env:
          SELECTED_FORMAT: ${{ inputs.target }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from linux_support import experimental_matrix
          matrix = experimental_matrix(os.environ['SELECTED_FORMAT'] or 'both')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix) + '\n')
          PY
  build:
    name: Validate ${{ matrix.target }}
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      IMAGE: ${{ matrix.image }}
      RELEASE: ${{ inputs.release && '1' || '0' }}
      RELEASE_COMMIT: ${{ inputs.ref }}
      RELEASE_VERSION: ${{ inputs.version }}
      DIST_DIR: /workspace/dist/linux
      GODEBUG: http2client=0
      REPOSITORY_PROBE: ${{ matrix.repository_probe }}
      REPOSITORY_FORMAT: ${{ matrix.repository_format }}
      IMAGE_ARCHIVE: ${{ matrix.image_archive }}
      IMAGE_ARCHIVE_SHA256: ${{ matrix.image_archive_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Check candidate repository before preparing build tools
        if: matrix.repository_probe != ''
        run: |
          echo "Checking candidate repository: $REPOSITORY_PROBE"
          curl -4 --fail --show-error --location --connect-timeout 8 --max-time 20 --retry 2 --retry-delay 2 --retry-all-errors "$REPOSITORY_PROBE" -o "$RUNNER_TEMP/repository-metadata"
          python3 - <<'PYXML'
          import os, pathlib, xml.etree.ElementTree as ET
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'repository-metadata'
          if os.environ['REPOSITORY_FORMAT'] == 'apt-rpm':
              content = path.read_text()
              assert 'Origin: ALT Linux Team' in content and 'Architectures: loongarch64 noarch' in content and 'classic' in content, 'Unexpected ALT repository metadata'
          else:
              root = ET.parse(path).getroot()
              assert root.tag == '{http://linux.duke.edu/metadata/repo}repomd', 'Candidate server did not return RPM repository metadata'
          PYXML
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: loong64
      - name: Prepare frontend, official Go and packaging tool
        run: |
          npm --prefix ui/frontend ci
          npm --prefix ui/frontend run build
          for attempt in 1 2 3; do
            GOOS=linux GOARCH=loong64 CGO_ENABLED=0 GOBIN='' go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.40.0 && break
            test "$attempt" != 3 || exit 1
          done
          mkdir -p "$RUNNER_TEMP/format-tools"
          cp "$(go env GOPATH)/bin/linux_loong64/nfpm" "$RUNNER_TEMP/format-tools/"
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts/loongarch')
          from validate import download
          from pathlib import Path
          environment = json.loads(Path('scripts/loongarch/environment.json').read_text())
          download(environment['goURL'], Path(os.environ['RUNNER_TEMP']) / 'go.tar.gz', environment['goSHA256'])
          PY
      - name: Select compiler cache epoch
        id: compiler-epoch
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: ~/.cache/fncpn-loongarch-formats/${{ matrix.target }}
          key: loongarch-compiler-${{ matrix.target }}-${{ steps.compiler-epoch.outputs.month }}-${{ hashFiles('go.sum', 'ui/go.sum') }}-${{ github.sha }}
          restore-keys: |
            loongarch-compiler-${{ matrix.target }}-${{ steps.compiler-epoch.outputs.month }}-${{ hashFiles('go.sum', 'ui/go.sum') }}-
      - name: Restore clean builder environment
        run: python3 scripts/loongarch/builder-cache.py restore
      - name: Load checksum-pinned official image archive
        if: matrix.image_archive != '' && (env.BUILDER_CACHE_HIT != '1' || inputs.runtime_validation)
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 "$IMAGE_ARCHIVE" -o "$RUNNER_TEMP/candidate.tar.xz"
          echo "$IMAGE_ARCHIVE_SHA256  $RUNNER_TEMP/candidate.tar.xz" | sha256sum -c -
          docker load -i "$RUNNER_TEMP/candidate.tar.xz"
      - name: Start pinned candidate image
        run: |
          mkdir -p "$HOME/.cache/fncpn-loongarch-formats/$TARGET/go-build" "$HOME/.cache/fncpn-loongarch-formats/$TARGET/go-mod"
          builder="$IMAGE"
          if [ "$BUILDER_CACHE_HIT" = 1 ]; then builder="$BUILDER_IMAGE"; fi
          docker run -d --platform linux/loong64 -v "$HOME/.cache/fncpn-loongarch-formats/$TARGET/go-build:/root/.cache/go-build" -v "$HOME/.cache/fncpn-loongarch-formats/$TARGET/go-mod:/root/go/pkg/mod" --name fncpn-format -e TARGET -e RELEASE -e RELEASE_COMMIT -e RELEASE_VERSION -e DIST_DIR -e GODEBUG -v "$GITHUB_WORKSPACE:/workspace" -v "$RUNNER_TEMP/format-tools:/opt/tools:ro" "$builder" sleep infinity
          docker exec fncpn-format mkdir -p /opt
          docker cp "$RUNNER_TEMP/go.tar.gz" fncpn-format:/opt/go.tar.gz
      - name: Verify dependency availability
        if: env.BUILDER_CACHE_HIT != '1'
        run: docker exec fncpn-format bash /workspace/scripts/loongarch/probe-format.sh bootstrap
      - name: Extract official Go after bootstrap tools are installed
        if: env.BUILDER_CACHE_HIT != '1'
        run: docker exec fncpn-format tar -xzf /opt/go.tar.gz -C /opt
      - name: Save clean builder environment
        if: env.BUILDER_CACHE_HIT != '1'
        run: python3 scripts/loongarch/builder-cache.py save
      - name: Verify native C and official Go toolchains
        run: docker exec fncpn-format bash /workspace/scripts/loongarch/probe-format.sh toolchain
      - name: Install release RPM signing tools
        if: inputs.release && startsWith(matrix.target, 'rpm')
        run: docker exec fncpn-format dnf install -y gnupg2 rpm-build
      - name: Build and inspect matching Core and UI packages
        env:
          RPM_SIGNING_PRIVATE_KEY: ${{ secrets.RPM_SIGNING_PRIVATE_KEY }}
          RPM_SIGNING_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
        run: docker exec -e RPM_SIGNING_PRIVATE_KEY -e RPM_SIGNING_PASSPHRASE fncpn-format bash /workspace/scripts/loongarch/probe-format.sh build
      - name: Select shared kernel cache epoch
        if: inputs.runtime_validation
        id: cache-epoch
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: inputs.runtime_validation
        with:
          path: ~/.cache/fncpn-loongarch
          key: loongarch-${{ steps.cache-epoch.outputs.month }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/loongarch/environment.json', 'scripts/loongarch/provision.sh', 'go.sum', 'ui/go.sum') }}-${{ github.sha }}
          restore-keys: |
            loongarch-${{ steps.cache-epoch.outputs.month }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/loongarch/environment.json', 'scripts/loongarch/provision.sh', 'go.sum', 'ui/go.sum') }}-
      - name: Install full-system emulator for one-time acceptance
        if: inputs.runtime_validation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-misc e2fsprogs
      - name: Install and start candidates in a clean runtime image
        if: inputs.runtime_validation
        run: |
          docker rm -f fncpn-format
          # Allow the real WebKit/image sandbox in the disposable test container.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run -d --privileged --shm-size=1g --platform linux/loong64 --name fncpn-format -e TARGET -e RELEASE -e RELEASE_COMMIT -e RELEASE_VERSION -e DIST_DIR -e GODEBUG -v "$GITHUB_WORKSPACE:/workspace" "$IMAGE" sleep infinity
          docker exec fncpn-format bash /workspace/scripts/loongarch/probe-format.sh runtime-bootstrap
          docker exec fncpn-format python3 /workspace/scripts/loongarch/runtime-format.py prepare
          sudo chown -R "$(id -u):$(id -g)" dist
          python3 scripts/loongarch/format-vm.py
      - name: Preserve compiler cache permissions
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/fncpn-loongarch-formats/$TARGET" || true
      - uses: actions/cache/save@v4
        if: always() && steps.compiler-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/fncpn-loongarch-formats/${{ matrix.target }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-packages-${{ matrix.target }}-loong64
          path: |
            dist/linux/**/*.rpm
            dist/linux/**/*.pkg.tar.zst
            dist/linux/**/*.json
            dist/linux/**/*.txt
            dist/linux/**/*.log
            dist/linux/**/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
      - name: Remove disposable candidate
        if: always()
        run: docker rm -f fncpn-format || true
