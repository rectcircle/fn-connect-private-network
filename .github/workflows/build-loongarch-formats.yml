name: Build LoongArch RPM and Arch
on:
  workflow_call:
    inputs:
      target:
        type: string
        default: both
      ref:
        type: string
        required: true
      version:
        type: string
        default: ''
      release:
        type: boolean
        default: false
      full_validation:
        description: Prepare upgrade fixtures for the separate acceptance workflow
        type: boolean
        default: false
    secrets:
      RPM_SIGNING_PRIVATE_KEY:
        required: false
      RPM_SIGNING_PASSPHRASE:
        required: false
  workflow_dispatch:
    inputs:
      target:
        description: Candidate package format
        type: choice
        options: [both, rpm, archlinux]
        default: both
      version:
        type: string
        default: ''
      release:
        type: boolean
        default: false
      full_validation:
        description: Prepare upgrade fixtures for the separate acceptance workflow
        type: boolean
        default: false
      ref:
        description: Source branch or full candidate commit
        type: string
        default: main
permissions:
  contents: read
concurrency:
  group: loongarch-formats-${{ github.workflow }}-${{ inputs.target }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ !inputs.release }}
jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: targets
        env:
          SELECTED_FORMAT: ${{ inputs.target }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from linux_support import loongarch_build_matrix
          matrix = loongarch_build_matrix(os.environ['SELECTED_FORMAT'] or 'both')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix) + '\n')
          PY
  build:
    name: Build ${{ matrix.target }}
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      IMAGE: ${{ matrix.image }}
      RELEASE: ${{ inputs.release && '1' || '0' }}
      RELEASE_COMMIT: ${{ inputs.ref }}
      RELEASE_VERSION: ${{ inputs.version }}
      FULL_ACCEPTANCE: ${{ inputs.full_validation && '1' || '0' }}
      DIST_DIR: /workspace/dist/linux
      GODEBUG: http2client=0
      REPOSITORY_PROBE: ${{ matrix.repository_probe }}
      IMAGE_ARCHIVE: ${{ matrix.image_archive }}
      IMAGE_ARCHIVE_SHA256: ${{ matrix.image_archive_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Check candidate repository before preparing build tools
        if: matrix.repository_probe != ''
        run: |
          bash scripts/loongarch/configure-openeuler-repos.sh --probe "$RUNNER_TEMP/repository-metadata"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: loong64
      - name: Prepare frontend, official Go and packaging tool
        run: |
          npm --prefix ui/frontend ci
          npm --prefix ui/frontend run build
          for attempt in 1 2 3; do
            GOOS=linux GOARCH=loong64 CGO_ENABLED=0 GOBIN='' go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.40.0 && break
            test "$attempt" != 3 || exit 1
          done
          mkdir -p "$RUNNER_TEMP/format-tools"
          cp "$(go env GOPATH)/bin/linux_loong64/nfpm" "$RUNNER_TEMP/format-tools/"
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts/loongarch')
          from validate import download
          from pathlib import Path
          environment = json.loads(Path('scripts/loongarch/environment.json').read_text())
          download(environment['goURL'], Path(os.environ['RUNNER_TEMP']) / 'go.tar.gz', environment['goSHA256'])
          PY
      - name: Select compiler cache epoch
        id: compiler-epoch
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: ~/.cache/fncpn-loongarch-formats/${{ matrix.target }}
          key: loongarch-compiler-${{ matrix.target }}-${{ steps.compiler-epoch.outputs.month }}-${{ hashFiles('go.sum', 'ui/go.sum') }}-${{ github.sha }}
          restore-keys: |
            loongarch-compiler-${{ matrix.target }}-${{ steps.compiler-epoch.outputs.month }}-${{ hashFiles('go.sum', 'ui/go.sum') }}-
      - name: Restore clean builder environment
        run: python3 scripts/loongarch/builder-cache.py restore
      - name: Load checksum-pinned official image archive
        if: matrix.image_archive != '' && env.BUILDER_CACHE_HIT != '1'
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 "$IMAGE_ARCHIVE" -o "$RUNNER_TEMP/candidate.tar.xz"
          echo "$IMAGE_ARCHIVE_SHA256  $RUNNER_TEMP/candidate.tar.xz" | sha256sum -c -
          docker load -i "$RUNNER_TEMP/candidate.tar.xz"
      - name: Start pinned candidate image
        run: |
          mkdir -p "$HOME/.cache/fncpn-loongarch-formats/$TARGET/go-build" "$HOME/.cache/fncpn-loongarch-formats/$TARGET/go-mod"
          builder="$IMAGE"
          if [ "$BUILDER_CACHE_HIT" = 1 ]; then builder="$BUILDER_IMAGE"; fi
          docker run -d --platform linux/loong64 -v "$HOME/.cache/fncpn-loongarch-formats/$TARGET/go-build:/root/.cache/go-build" -v "$HOME/.cache/fncpn-loongarch-formats/$TARGET/go-mod:/root/go/pkg/mod" --name fncpn-format -e TARGET -e RELEASE -e RELEASE_COMMIT -e RELEASE_VERSION -e FULL_ACCEPTANCE -e DIST_DIR -e GODEBUG -v "$GITHUB_WORKSPACE:/workspace" -v "$RUNNER_TEMP/format-tools:/opt/tools:ro" "$builder" sleep infinity
          docker exec fncpn-format mkdir -p /opt
          docker cp "$RUNNER_TEMP/go.tar.gz" fncpn-format:/opt/go.tar.gz
      - name: Verify dependency availability
        if: env.BUILDER_CACHE_HIT != '1'
        run: docker exec fncpn-format bash /workspace/scripts/loongarch/probe-format.sh bootstrap
      - name: Extract official Go after bootstrap tools are installed
        if: env.BUILDER_CACHE_HIT != '1'
        run: docker exec fncpn-format tar -xzf /opt/go.tar.gz -C /opt
      - name: Save clean builder environment
        if: env.BUILDER_CACHE_HIT != '1'
        run: python3 scripts/loongarch/builder-cache.py save
      - name: Install release RPM signing tools
        if: inputs.release && startsWith(matrix.target, 'rpm')
        run: docker exec fncpn-format dnf install -y gnupg2 rpm-build
      - name: Build and inspect matching Core and UI packages
        env:
          RPM_SIGNING_PRIVATE_KEY: ${{ secrets.RPM_SIGNING_PRIVATE_KEY }}
          RPM_SIGNING_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
        run: docker exec -e RPM_SIGNING_PRIVATE_KEY -e RPM_SIGNING_PASSPHRASE fncpn-format bash /workspace/scripts/loongarch/probe-format.sh build
      - name: Preserve compiler cache permissions
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/fncpn-loongarch-formats/$TARGET" || true
      - uses: actions/cache/save@v4
        if: always() && steps.compiler-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/fncpn-loongarch-formats/${{ matrix.target }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: linux-packages-${{ matrix.target }}-loong64
          path: |
            dist/linux/**/*.rpm
            dist/linux/**/*.pkg.tar.zst
            dist/linux/**/*.json
            dist/linux/**/*.txt
            dist/linux/**/*.log
            dist/linux/**/SHA256SUMS
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Remove disposable candidate
        if: always()
        run: docker rm -f fncpn-format || true
