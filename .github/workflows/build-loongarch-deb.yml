name: Build LoongArch DEB
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      version:
        type: string
        default: ''
      full_validation:
        description: Run source regressions and full package/kernel acceptance
        type: boolean
        default: false
      defer_system_validation:
        description: Run package acceptance separately after uploading the DEBs
        type: boolean
        default: false
      full_regression:
        type: boolean
        default: false
      release:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref (full commit SHA for release candidates)
        type: string
        default: ''
      version:
        type: string
        default: ''
      full_validation:
        description: Run source regressions and full package/kernel acceptance
        type: boolean
        default: false
      full_regression:
        type: boolean
        default: false
      release:
        description: Enforce clean same-commit candidate (does not publish)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: loongarch-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ !inputs.release }}
jobs:
  validate:
    # QEMU >= 10 supports this firmware's 16 MiB LoongArch ROM layout.
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    env:
      RELEASE: ${{ inputs.release && '1' || '0' }}
      RELEASE_COMMIT: ${{ inputs.ref }}
      RELEASE_VERSION: ${{ inputs.version }}
      FULL_VALIDATION: ${{ inputs.full_validation && '1' || '0' }}
      DEFER_SYSTEM_VALIDATION: ${{ inputs.defer_system_validation && '1' || '0' }}
      FORCE_ROOT_REGRESSION: ${{ inputs.full_regression && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - id: cache-epoch
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fncpn-loongarch
          key: loongarch-${{ steps.cache-epoch.outputs.month }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/loongarch/environment.json', 'scripts/loongarch/provision.sh', 'go.sum', 'apps/shared/wails/go.sum') }}-${{ github.sha }}
          restore-keys: |
            loongarch-${{ steps.cache-epoch.outputs.month }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/loongarch/environment.json', 'scripts/loongarch/provision.sh', 'go.sum', 'apps/shared/wails/go.sum') }}-
      - name: Install full-system emulator and filesystem tools
        if: inputs.full_validation && !inputs.defer_system_validation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-misc e2fsprogs
          qemu-system-loongarch64 --version
          python3 -c 'import re, subprocess; version = subprocess.check_output(["qemu-system-loongarch64", "--version"], text=True); assert int(re.search(r"version (\d+)", version)[1]) >= 10, "LoongArch firmware requires QEMU >= 10"'
      - name: Register LoongArch user-mode emulator
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: loong64
      - name: Cross-compile Core, tests and packaging tool
        run: python3 scripts/loongarch/validate.py --stage prepare
      - name: Restore or prepare compilation environment
        run: python3 scripts/loongarch/validate.py --stage builder
      - name: Prepare Go toolchain and optional source regressions
        run: python3 scripts/loongarch/validate.py --stage tests
      - name: Build final Core and UI DEBs
        run: python3 scripts/loongarch/validate.py --stage packages
      - name: Restore clean runtime and cache package dependencies
        if: inputs.full_validation && !inputs.defer_system_validation
        run: python3 scripts/loongarch/validate.py --stage runtime
      - name: Validate installed packages and real kernel in VM
        if: inputs.full_validation && !inputs.defer_system_validation
        run: python3 scripts/loongarch/validate.py --stage system
      - name: Finalize evidence and clean disposable environments
        if: always()
        run: python3 scripts/loongarch/validate.py --stage finish
      - name: Publish build and acceptance report
        if: always()
        run: |
          if [ -f dist/loongarch-validation/summary.md ]; then
            cat dist/loongarch-validation/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Validation did not reach the report writer; inspect workflow setup logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: loongarch-validation-${{ steps.source.outputs.commit }}
          path: |
            dist/loongarch-validation/
            !dist/loongarch-validation/tests/*.test
            !dist/loongarch-validation/fncpn
            !dist/loongarch-validation/fncpn-ui
            !dist/loongarch-validation/probe
            !dist/loongarch-validation/upgrade-fixture/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          overwrite: true
          name: loongarch-validation-binaries-${{ steps.source.outputs.commit }}
          path: |
            dist/loongarch-validation/fncpn
            dist/loongarch-validation/fncpn-ui
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-packages-deb-loong64-loong64
          path: |
            dist/linux/**/*.deb
            dist/linux/**/*.rpm
            dist/linux/**/*.pkg.tar.zst
            dist/linux/**/build-manifest.json
            dist/linux/**/SHA256SUMS
            dist/linux/**/upgrade-fixture/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.full_validation && !inputs.defer_system_validation
        with:
          overwrite: true
          name: linux-compat-debian-forky-loong64
          path: dist/linux-compat/
          if-no-files-found: error
