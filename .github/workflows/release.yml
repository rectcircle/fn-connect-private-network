name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version (MAJOR.MINOR.PATCH)
        required: true
        type: string
      commit:
        description: Full candidate commit SHA (40 lowercase hex characters)
        required: true
        type: string
      publish:
        description: Make the verified draft public
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Validate immutable candidate
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/check-release-candidate.py
  nix-dependencies:
    needs: candidate
    if: ${{ !inputs.publish }}
    uses: ./.github/workflows/check-nix.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.commit }}
      build: false
  windows-build:
    needs: nix-dependencies
    if: ${{ !inputs.publish }}
    # Match the native build generator (Visual Studio 17 2022).
    # windows-2025 now defaults to VS 2026.
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify release candidate, generated resources and Windows Go packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = '${{ inputs.commit }}'
          $version = (Get-Content internal/version/VERSION -Raw).Trim()
          if ($version -ne '${{ inputs.version }}') { throw 'Candidate version does not match checkout' }
          if ($candidate -ne (& git rev-parse HEAD).Trim()) { throw 'Candidate commit does not match checkout' }
          if (& git status --porcelain) { throw 'Release requires a clean checkout' }
          python scripts/sync-version.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Generated product versions are stale' }
          python scripts/sync-localizations.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Generated localization catalogs are stale' }
          python scripts/sync-native-localizations.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Generated native localization catalog is stale' }
          ./scripts/windows/check-localization.ps1
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows Go tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows Go vet failed' }
      - name: Install pinned WiX and official Wintun payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wix = Join-Path $PWD '.dev/tools/wix'
          $wintun = Join-Path $PWD '.dev/dependencies/wintun/0.14.1'
          $webview2 = Join-Path $PWD '.dev/dependencies/webview2/MicrosoftEdgeWebView2Setup.exe'
          New-Item -ItemType Directory -Force -Path $wix, (Split-Path -Parent $wintun), (Split-Path -Parent $webview2) | Out-Null
          dotnet tool install wix --version 7.0.0 --tool-path $wix
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          Push-Location $wix
          try {
            foreach ($extension in @('Util', 'UI')) {
              & ./wix.exe -acceptEula wix7 extension add "WixToolset.$extension.wixext/7.0.0"
              if ($LASTEXITCODE -ne 0) { throw "WiX $extension extension installation failed" }
            }
          } finally { Pop-Location }
          $archive = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          Invoke-WebRequest 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51') { throw 'Wintun archive SHA256 mismatch' }
          $stage = Join-Path $env:RUNNER_TEMP 'wintun-stage'
          Expand-Archive -LiteralPath $archive -DestinationPath $stage
          Move-Item -LiteralPath (Join-Path $stage 'wintun') -Destination $wintun
          foreach ($arch in @('arm64', 'amd64')) {
            $dll = Join-Path $wintun "bin/$arch/wintun.dll"
            if ((Get-AuthenticodeSignature $dll).Status -ne 'Valid') { throw "Invalid Wintun signature: $dll" }
          }
          $webview2Cache = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2Setup.exe'
          Invoke-WebRequest -UseBasicParsing 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $webview2Cache
          $webview2Signature = Get-AuthenticodeSignature $webview2Cache
          if ($webview2Signature.Status -ne 'Valid' -or $webview2Signature.SignerCertificate.Subject -notlike '*Microsoft Corporation*') { throw 'Invalid Microsoft WebView2 bootstrapper signature' }
          Copy-Item -LiteralPath $webview2Cache -Destination $webview2
      - name: Build ARM64 and x64 release MSIs
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-candidates-${{ inputs.commit }}
          path: |
            dist/windows-native/arm64/fncpn-*-windows-arm64-unsigned.msi
            dist/windows-native/arm64/build-manifest.json
            dist/windows-native/x64/fncpn-*-windows-x64-unsigned.msi
            dist/windows-native/x64/build-manifest.json
          if-no-files-found: error
  nix-check:
    needs: nix-dependencies
    if: ${{ !inputs.publish }}
    uses: ./.github/workflows/check-nix.yml
    with:
      ref: ${{ inputs.commit }}
      build: true
  fnos-check:
    needs: nix-dependencies
    if: ${{ !inputs.publish }}
    uses: ./.github/workflows/check-fnos.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.commit }}
  linux-build:
    needs: nix-dependencies
    if: ${{ !inputs.publish }}
    uses: ./.github/workflows/build-linux.yml
    secrets:
      RPM_SIGNING_PRIVATE_KEY: ${{ secrets.RPM_SIGNING_PRIVATE_KEY }}
      RPM_SIGNING_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
    permissions:
      contents: read
    with:
      ref: ${{ inputs.commit }}
      version: ${{ inputs.version }}
      release: true
  android-build:
    needs: nix-dependencies
    if: ${{ !inputs.publish }}
    uses: ./.github/workflows/build-android.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.commit }}
      version: ${{ inputs.version }}
      release: true
    secrets:
      FNCPN_KEYSTORE_BASE64: ${{ secrets.FNCPN_KEYSTORE_BASE64 }}
      FNCPN_STORE_PASSWORD: ${{ secrets.FNCPN_STORE_PASSWORD }}
      FNCPN_KEY_ALIAS: ${{ secrets.FNCPN_KEY_ALIAS }}
      FNCPN_KEY_PASSWORD: ${{ secrets.FNCPN_KEY_PASSWORD }}
  ios-build:
    needs: candidate
    if: ${{ !inputs.publish }}
    uses: ./.github/workflows/build-ios.yml
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.commit }}
  harmonyos-build:
    needs: candidate
    if: ${{ !inputs.publish }}
    uses: ./.github/workflows/build-harmonyos.yml
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.commit }}
  release:
    if: ${{ !inputs.publish }}
    needs: [windows-build, linux-build, nix-check, android-build, ios-build, harmonyos-build, fnos-check]
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      ARCH: arm64
      RELEASE: "1"
      DIST_DIR: ${{ github.workspace }}/dist
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Verify candidate and toolchain
        run: |
          test "$(uname -m)" = arm64
          python3 scripts/check-release-candidate.py
          test "$(xcodebuild -version | head -1)" = "Xcode 16.4"
          echo "FNPACK=$RUNNER_TEMP/fnpack" >> "$GITHUB_ENV"
          ./scripts/install-fnpack.sh "$RUNNER_TEMP/fnpack"
      - name: Validate
        run: ./scripts/check-release.sh
      - name: Verify root-owned fnOS state recovery
        run: sudo bash scripts/test-fnos-state-permissions.sh
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.publish }}
        with:
          name: windows-release-candidates-${{ inputs.commit }}
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-packages-*
          path: dist/linux
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-compat-*
          path: dist/linux-compat
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: android-release-candidates-${{ inputs.commit }}
          path: dist/android
      - uses: actions/download-artifact@v4
        with:
          name: ios-release-candidates-${{ inputs.commit }}
          path: dist/ios
      - uses: actions/download-artifact@v4
        with:
          name: harmonyos-release-candidates-${{ inputs.commit }}
          path: dist/harmonyos
      - name: Build release draft
        if: ${{ !inputs.publish }}
        run: ./scripts/build-all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ inputs.commit }}
          path: dist/
          if-no-files-found: error
      - name: Upload and verify release draft
        run: python3 scripts/publish-release.py "$DIST_DIR"
  publish:
    needs: candidate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_VERSION: ${{ inputs.version }}
      DIST_DIR: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Verify candidate and download existing draft
        run: |
          python3 scripts/check-release-candidate.py
          mkdir -p "$DIST_DIR"
          python3 scripts/download-release.py "$RELEASE_TAG" "$DIST_DIR" --repo "$GITHUB_REPOSITORY"
      - name: Verify existing assets and make release public
        run: python3 scripts/publish-release.py "$DIST_DIR" --publish
  mirror-quark:
    needs: publish
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    permissions:
      contents: read
    uses: ./.github/workflows/mirror-quark.yml
    with:
      tag: v${{ inputs.version }}
    secrets:
      QUARK_AUTH: ${{ secrets.QUARK_AUTH }}
  update-cask:
    needs: publish
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
      - name: Update public stable release cask
        run: |
          VERSION="$(cat internal/version/VERSION)"
          git fetch origin main
          git checkout -B cask-update origin/main
          python3 scripts/update-cask.py "$VERSION"
          git add Casks/
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "chore(homebrew): publish ${VERSION}"
            git push origin HEAD:main
          fi
