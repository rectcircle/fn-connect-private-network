name: Check Nix Flake
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate all outputs and build the native packages and module check
        run: |
          nix flake check --no-build --no-update-lock-file
          nix build --no-link --no-update-lock-file .#checks.${{ matrix.system }}.core .#checks.${{ matrix.system }}.ui .#checks.${{ matrix.system }}.module
