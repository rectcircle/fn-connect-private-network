name: Check Nix Flake
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      build:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      build:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate all outputs
        run: nix flake check --no-build --no-update-lock-file
      - name: Verify locked Core and UI Go dependency hashes
        run: scripts/update-nix-go-hashes.sh --check --system ${{ matrix.system }}
      - name: Build native packages and module check (draft only)
        if: inputs.build
        run: |
          nix build --no-link --no-update-lock-file .#checks.${{ matrix.system }}.core .#checks.${{ matrix.system }}.ui .#checks.${{ matrix.system }}.module
      - name: Run packaged Nix UI with a virtual display (draft only)
        if: inputs.build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus fonts-dejavu-core libgl1-mesa-dri
          # Ubuntu's runner AppArmor policy can deny the Nix-store bwrap path.
          # Permit user namespaces on this disposable runner; keep WebKit sandboxing.
          mkdir -p dist/nix-smoke
          sudo env GITHUB_ACTIONS=true python3 scripts/prepare-linux-sandbox.py | tee dist/nix-smoke/sandbox-policy.json
          ui_path=$(nix build --no-update-lock-file --no-link --print-out-paths .#checks.${{ matrix.system }}.ui)
          python3 scripts/linux-ui-smoke.py "$ui_path/bin/fncpn-ui" dist/nix-smoke "$(cat internal/version/VERSION)" "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.build }}
        with:
          name: nix-smoke-${{ matrix.system }}
          path: dist/nix-smoke/
