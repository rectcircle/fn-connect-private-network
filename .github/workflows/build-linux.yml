name: Build Linux
on:
  workflow_call:
    inputs:
      version:
        description: Product version for release candidates
        type: string
        required: false
      ref:
        type: string
        required: false
        default: ''
      loongarch_full_validation:
        type: boolean
        default: false
      release:
        type: boolean
        required: false
        default: false
    secrets:
      RPM_SIGNING_PRIVATE_KEY:
        required: false
      RPM_SIGNING_PASSPHRASE:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Product version for release candidates
        type: string
        required: false
      ref:
        description: Source ref (full commit SHA for release candidates)
        type: string
        required: true
        default: main
      loongarch_full_validation:
        type: boolean
        default: false
      release:
        description: Enforce matching clean candidate commit (artifacts only)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      compatibility: ${{ steps.targets.outputs.compatibility }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: targets
        run: |
          echo "matrix=$(python3 scripts/linux_support.py build-matrix)" >> "$GITHUB_OUTPUT"
          echo "compatibility=$(python3 scripts/linux_support.py native-matrix)" >> "$GITHUB_OUTPUT"
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Check shared packaging policies and frontend once
        run: |
          python3 scripts/rpm_signing_test.py
          python3 scripts/install_linux_test.py
          python3 scripts/linux_support_test.py
          python3 scripts/linux_acceptance_test.py
          python3 scripts/linux_compatibility_test.py
          python3 scripts/release_manifest_test.py
          python3 scripts/publish_release_test.py
          bash -n scripts/install-linux.sh scripts/build-linux-core.sh scripts/build-linux-ui.sh scripts/test-debian13.sh
          for script in packaging/linux/scripts/*; do sh -n "$script"; done
          npm --prefix ui/frontend ci
          npm --prefix ui/frontend test
  loongarch:
    uses: ./.github/workflows/build-loongarch-deb.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      version: ${{ inputs.version || '' }}
      release: ${{ inputs.release == true }}
      defer_system_validation: true
      full_validation: ${{ inputs.loongarch_full_validation == true }}
  loongarch-rpm:
    uses: ./.github/workflows/build-loongarch-formats.yml
    with:
      target: rpm
      ref: ${{ inputs.ref || github.sha }}
      release: ${{ inputs.release == true }}
      version: ${{ inputs.version || '' }}
      full_validation: ${{ inputs.loongarch_full_validation == true }}
    secrets:
      RPM_SIGNING_PRIVATE_KEY: ${{ secrets.RPM_SIGNING_PRIVATE_KEY }}
      RPM_SIGNING_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
  loongarch-arch:
    uses: ./.github/workflows/build-loongarch-formats.yml
    with:
      target: archlinux
      ref: ${{ inputs.ref || github.sha }}
      release: ${{ inputs.release == true }}
      version: ${{ inputs.version || '' }}
      full_validation: ${{ inputs.loongarch_full_validation == true }}
    secrets:
      RPM_SIGNING_PRIVATE_KEY: ${{ secrets.RPM_SIGNING_PRIVATE_KEY }}
      RPM_SIGNING_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
  loongarch-tests:
    if: inputs.loongarch_full_validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Cross-compile shared VM acceptance tests once
        run: python3 scripts/loongarch/prepare-acceptance.py tests
      - uses: actions/upload-artifact@v4
        with:
          name: loongarch-acceptance-tests
          path: dist/loongarch-validation/
          if-no-files-found: error
          overwrite: true
  loongarch-acceptance-rpm:
    needs: [loongarch-rpm, loongarch-tests]
    if: inputs.loongarch_full_validation
    uses: ./.github/workflows/accept-loongarch-packages.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      version: ${{ inputs.version || '' }}
      target: openeuler
      tests_artifact: loongarch-acceptance-tests
      full_validation: true
  loongarch-acceptance-arch:
    needs: [loongarch-arch, loongarch-tests]
    if: inputs.loongarch_full_validation
    uses: ./.github/workflows/accept-loongarch-packages.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      version: ${{ inputs.version || '' }}
      target: archlinux
      tests_artifact: loongarch-acceptance-tests
      full_validation: true
  loongarch-acceptance-debian:
    needs: [loongarch, loongarch-tests]
    if: inputs.loongarch_full_validation
    uses: ./.github/workflows/accept-loongarch-packages.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      version: ${{ inputs.version || '' }}
      target: debian
      tests_artifact: loongarch-acceptance-tests
      full_validation: true
  loongarch-acceptance-deepin:
    needs: [loongarch, loongarch-tests]
    if: inputs.loongarch_full_validation
    uses: ./.github/workflows/accept-loongarch-packages.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      version: ${{ inputs.version || '' }}
      target: deepin
      tests_artifact: loongarch-acceptance-tests
      full_validation: true
  build:
    needs: targets
    name: ${{ matrix.target }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      DEBIAN_FRONTEND: noninteractive
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      RELEASE_COMMIT: ${{ inputs.ref }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE: ${{ inputs.release && '1' || '0' }}
      DEFER_LINUX_MANIFEST: '1'
    steps:
      # Bootstrap before checkout because minimal images may not have git/Python.
      - name: Bootstrap Debian and Ubuntu container
        if: matrix.family == 'deb'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl python3 tar xz-utils
      - name: Bootstrap Fedora container
        if: matrix.family == 'fedora'
        run: dnf install -y git ca-certificates curl python3 tar xz
      - name: Bootstrap openSUSE container
        if: matrix.family == 'suse'
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends git ca-certificates curl python3 tar xz
      - name: Bootstrap Arch container (full rolling upgrade)
        if: matrix.family == 'arch'
        run: pacman -Syu --noconfirm --needed git ca-certificates curl python tar xz
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Trust the mounted checkout for container Git commands
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Keep standard executable locations in the runner's prepended PATH.
          # Minimal images may not expose PATH in Docker image metadata.
          for directory in /usr/local/sbin /usr/local/bin /usr/sbin /usr/bin /sbin /bin; do
            echo "$directory" >> "$GITHUB_PATH"
          done
      - name: Install target-specific build dependencies
        run: python3 scripts/linux-ci-dependencies.py "$TARGET"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            go.sum
            ui/go.sum
      - name: Install pinned official Node binary
        run: scripts/install-linux-node.sh
      - name: Install pinned build tools
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.40.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify native Go, UI and distribution integration
        run: |
          test "$(go env GOARCH)" = "$ARCH"
          python3 scripts/sync-version.py --check
          sh scripts/test-linux-activation.sh
          go test ./...
          go vet ./...
          npm --prefix ui/frontend ci
          npm --prefix ui/frontend run build
          (cd ui && go test -tags webkit2_41 ./... && go vet -tags webkit2_41 ./...)
          desktop-file-validate packaging/linux/desktop/fncpn.desktop
      - name: Build matching Core and UI packages on the target distribution
        run: |
          scripts/build-linux-core.sh
          scripts/build-linux-ui.sh
          python3 scripts/check-linux-packages.py "dist/linux/$TARGET/$ARCH" "$TARGET" "$ARCH"
          test -z "$(ldd "dist/linux/$TARGET/$ARCH/fncpn-ui" | grep 'not found' || true)"
          if [ '${{ matrix.format }}' = deb ]; then
            apt-get --simulate install "./dist/linux/$TARGET/$ARCH/"*.deb
          fi
      - name: Install RPM signing tools
        if: inputs.release && matrix.format == 'rpm'
        run: zypper --non-interactive install --no-recommends gpg2 rpm-build
      - name: Sign RPM release packages
        if: inputs.release && matrix.format == 'rpm'
        env:
          RPM_SIGNING_PRIVATE_KEY: ${{ secrets.RPM_SIGNING_PRIVATE_KEY }}
          RPM_SIGNING_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
        run: python3 scripts/rpm_signing.py sign "dist/linux/$TARGET/$ARCH/"*.rpm
      - name: Reject unsigned, corrupt and untrusted RPM fixtures
        if: inputs.release && matrix.format == 'rpm'
        run: FNCPN_TEST_SIGNED_RPM="dist/linux/$TARGET/$ARCH/fncpn-core-$(cat internal/version/VERSION)-linux-$ARCH.rpm" python3 scripts/rpm_signing_test.py
      - name: Record final package hashes and signing evidence
        run: python3 scripts/linux-build-manifest.py "dist/linux/$TARGET/$ARCH" "$TARGET" "$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-packages-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/linux/**/*.deb
            dist/linux/**/*.rpm
            dist/linux/**/*.pkg.tar.zst
            dist/linux/**/build-manifest.json
            dist/linux/**/SHA256SUMS
          if-no-files-found: error

  compatibility:
    needs: [targets, build]
    if: ${{ inputs.release }}
    name: Compatibility ${{ matrix.target }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.targets.outputs.compatibility) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
      # Draft-only disposable containers must permit nested Glycin/WebKit
      # sandboxes, including devpts mounts; UI still runs as an ordinary user.
      options: --shm-size=1g --privileged
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Bootstrap Debian and Ubuntu
        if: matrix.family == 'deb'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3
      - name: Bootstrap Fedora
        if: matrix.family == 'fedora'
        run: dnf install -y git ca-certificates python3
      - name: Bootstrap openSUSE
        if: matrix.family == 'suse'
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends git ca-certificates python3
      - name: Bootstrap Arch
        if: matrix.family == 'arch'
        run: pacman -Syu --noconfirm --needed git ca-certificates python
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Trust the mounted checkout for container Git commands
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Keep standard executable locations in the runner's prepended PATH.
          # Minimal images may not expose PATH in Docker image metadata.
          for directory in /usr/local/sbin /usr/local/bin /usr/sbin /usr/bin /sbin /bin; do
            echo "$directory" >> "$GITHUB_PATH"
          done
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-${{ matrix.format }}-${{ matrix.arch }}
          path: dist/linux
      - name: Resolve dependencies and check the same shared binaries
        env:
          FNCPN_COMPAT_IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p 'dist/linux-compat/${{ matrix.target }}-${{ matrix.arch }}'
          # Docker privileges do not bypass Ubuntu's host userns capability policy.
          python3 scripts/prepare-linux-sandbox.py | tee 'dist/linux-compat/${{ matrix.target }}-${{ matrix.arch }}/sandbox-policy.json'
          python3 scripts/linux-compatibility.py '${{ matrix.target }}' '${{ matrix.arch }}' dist/linux 2>&1 | tee 'dist/linux-compat/${{ matrix.target }}-${{ matrix.arch }}/install.log'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: linux-compat-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/linux-compat/
          if-no-files-found: error
