name: Validate LoongArch derivative compatibility
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full source commit matching the existing draft
        type: string
        required: true
      version:
        type: string
        default: '1.1.8'
      target:
        type: choice
        options: [both, deepin, anolis]
        default: both
# Reading unpublished drafts requires push-equivalent contents permission.
permissions:
  contents: write
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: deepin25-loong64
            selection: deepin
            extension: deb
          - target: anolis23-loong64
            selection: anolis
            extension: rpm
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      RELEASE: '1'
      DIST_DIR: /workspace/dist/linux
      FNCPN_RELEASE_INVENTORY: /workspace/dist/linux/${{ matrix.target }}/loong64/release-${{ inputs.version }}.json
    steps:
      - uses: actions/checkout@v5
        if: inputs.target == 'both' || inputs.target == matrix.selection
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        if: inputs.target == 'both' || inputs.target == matrix.selection
        with:
          platforms: loong64
      - name: Fetch exact existing draft packages
        if: inputs.target == 'both' || inputs.target == matrix.selection
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          out="dist/linux/$TARGET/loong64"
          mkdir -p "$out"
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          from release_assets import find_release, assets, download_asset
          repository = os.environ['GITHUB_REPOSITORY']
          release = find_release(repository, 'v'+os.environ['VERSION'])
          assert release is not None, 'Draft release was not found'
          directory = pathlib.Path('dist/linux') / os.environ['TARGET'] / 'loong64'
          wanted = {f"fncpn-{component}-{os.environ['VERSION']}-linux-loong64.{os.environ['EXTENSION']}" for component in ('core','ui')}
          wanted.add('release-'+os.environ['VERSION']+'.json')
          selected = [asset for asset in assets(repository, release['id']) if asset['name'] in wanted]
          assert {asset['name'] for asset in selected} == wanted, 'Missing exact draft assets'
          for asset in selected:
              download_asset(repository, asset, directory)
          record = json.loads((pathlib.Path('dist/linux') / os.environ['TARGET'] / 'loong64' / ('release-'+os.environ['VERSION']+'.json')).read_text())
          assert record['commit'] == subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'Draft and checkout must have identical source'
          PY
      - name: Select kernel cache epoch
        if: inputs.target == 'both' || inputs.target == matrix.selection
        id: cache-epoch
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: inputs.target == 'both' || inputs.target == matrix.selection
        with:
          path: ~/.cache/fncpn-loongarch
          key: loongarch-${{ steps.cache-epoch.outputs.month }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/loongarch/environment.json', 'scripts/loongarch/provision.sh', 'go.sum', 'ui/go.sum') }}-${{ github.sha }}
          restore-keys: |
            loongarch-${{ steps.cache-epoch.outputs.month }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/loongarch/environment.json', 'scripts/loongarch/provision.sh', 'go.sum', 'ui/go.sum') }}-
      - name: Prepare clean upstream userspace and install exact packages
        if: inputs.target == 'both' || inputs.target == matrix.selection
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-misc e2fsprogs
          python3 scripts/loongarch/prepare-compat.py
          docker exec fncpn-format bash /workspace/scripts/loongarch/probe-format.sh runtime-bootstrap
          docker exec fncpn-format python3 /workspace/scripts/loongarch/runtime-format.py prepare
          sudo chown -R "$(id -u):$(id -g)" "dist/linux/$TARGET"
          python3 scripts/loongarch/format-vm.py
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.target == 'both' || inputs.target == matrix.selection)
        with:
          name: loongarch-compat-${{ matrix.target }}
          path: |
            dist/linux/${{ matrix.target }}/**/*.json
            dist/linux/${{ matrix.target }}/**/*.log
            dist/linux/${{ matrix.target }}/**/*.txt
            dist/linux/${{ matrix.target }}/**/guest-results.tar.gz
          if-no-files-found: warn
      - name: Remove disposable environment
        if: always()
        run: docker rm -f fncpn-format fncpn-anolis-seed fncpn-format-kernel || true
