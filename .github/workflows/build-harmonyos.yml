name: HarmonyOS
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
      ref:
        description: Full candidate commit SHA
        type: string
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    # Linux x64 builds ARM64 HAPs; no Huawei login or signing identity required.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Verify immutable candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.ref }}
        run: |
          python3 scripts/check-release-candidate.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libusb-1.0-0 ninja-build
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/harmonyos/command-line-tools
            ~/.local/opt/harmonyos/go
          key: harmonyos-linux-x64-${{ runner.os }}-${{ hashFiles('apps/harmonyos/toolchains.json', 'scripts/harmonyos/setup_linux.py', 'scripts/harmonyos/go_toolchain.py') }}
      - name: Prepare pinned community Go and run checks
        run: |
          python3 scripts/harmonyos/setup_linux.py
          bash scripts/check-harmonyos.sh
          python3 scripts/harmonyos_release_test.py
      - name: Build unsigned system VPN candidate
        run: |
          bash scripts/build-harmonyos.sh --release
          bash scripts/package-harmonyos.sh --release
      - name: Verify unsigned publication candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.ref }}
        run: |
          PYTHONPATH=scripts python3 -c 'import os; from harmonyos_release import candidates; candidates("dist", os.environ["RELEASE_VERSION"], os.environ["RELEASE_COMMIT"])'
      - uses: actions/upload-artifact@v4
        with:
          name: harmonyos-release-candidates-${{ inputs.ref }}
          path: |
            dist/harmonyos/*-harmonyos-arm64-release-unsigned.hap
            dist/harmonyos/build-manifest-release.json
          if-no-files-found: error
