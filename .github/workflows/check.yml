name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  source:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - run: ./scripts/check-release.sh
      - name: Verify root-owned fnOS state recovery
        run: sudo bash scripts/test-fnos-state-permissions.sh
  linux:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Linux unit tests and package policy (full distro matrix runs only for drafts)
        run: |
          go test ./...
          go vet ./...
          python3 scripts/rpm_signing_test.py
          python3 scripts/linux_support_test.py
          python3 scripts/linux_acceptance_test.py
          python3 scripts/linux_compatibility_test.py
          python3 scripts/install_linux_test.py
          npm --prefix apps/shared/wails/frontend ci
          npm --prefix apps/shared/wails/frontend test
          for script in apps/linux/packaging/scripts/*; do sh -n "$script"; done
  fnos:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/check-fnos.yml
  nix:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/check-nix.yml
  windows:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # Match the native build generator (Visual Studio 17 2022).
    # windows-2025 now defaults to VS 2026.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Check Windows source, localization, setup and Go
        shell: pwsh
        run: ./scripts/check-windows.ps1 -SkipPackage
      - name: Install pinned WiX and official Wintun payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wix = Join-Path $PWD '.dev/tools/wix'
          $wintun = Join-Path $PWD '.dev/dependencies/wintun/0.14.1'
          $webview2 = Join-Path $PWD '.dev/dependencies/webview2/MicrosoftEdgeWebView2Setup.exe'
          New-Item -ItemType Directory -Force -Path $wix, (Split-Path -Parent $wintun), (Split-Path -Parent $webview2) | Out-Null
          dotnet tool install wix --version 7.0.0 --tool-path $wix
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          Push-Location $wix
          try {
            foreach ($extension in @('Util', 'UI')) {
              & ./wix.exe -acceptEula wix7 extension add "WixToolset.$extension.wixext/7.0.0"
              if ($LASTEXITCODE -ne 0) { throw "WiX $extension extension installation failed" }
            }
          } finally { Pop-Location }
          $archive = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          Invoke-WebRequest 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51') { throw 'Wintun archive SHA256 mismatch' }
          $stage = Join-Path $env:RUNNER_TEMP 'wintun-stage'
          Expand-Archive -LiteralPath $archive -DestinationPath $stage
          Move-Item -LiteralPath (Join-Path $stage 'wintun') -Destination $wintun
          foreach ($arch in @('arm64', 'amd64')) {
            $dll = Join-Path $wintun "bin/$arch/wintun.dll"
            if ((Get-AuthenticodeSignature $dll).Status -ne 'Valid') { throw "Invalid Wintun signature: $dll" }
          }
          $webview2Cache = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2Setup.exe'
          Invoke-WebRequest -UseBasicParsing 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $webview2Cache
          $webview2Signature = Get-AuthenticodeSignature $webview2Cache
          if ($webview2Signature.Status -ne 'Valid' -or $webview2Signature.SignerCertificate.Subject -notlike '*Microsoft Corporation*') { throw 'Invalid Microsoft WebView2 bootstrapper signature' }
          Copy-Item -LiteralPath $webview2Cache -Destination $webview2
      - name: Build ARM64 and x64 native Win32 clients and MSI packages
        run: ./scripts/build-windows.ps1
      - name: Native UI and MSI smoke (x64)
        run: ./scripts/windows/test-ui-smoke.ps1 -Architecture x64

  check:
    if: always()
    needs: [changes, source, linux, fnos, nix, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYGATE'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['changes']['result'] == 'success', results
          selected = results['changes']['outputs']['run']
          assert selected in ('true', 'false'), results
          expected = 'success' if selected == 'true' else 'skipped'
          assert all(item['result'] == expected for name, item in results.items() if name != 'changes'), results
          PYGATE
