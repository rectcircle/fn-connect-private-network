<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>FnCPN</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f5f7;
      --surface: #ffffff;
      --surface-muted: #f7f8fa;
      --text: #18202a;
      --muted: #66717e;
      --border: #d8dde4;
      --primary: #225fc2;
      --success: #17835d;
      --danger: #bd3c35;
      --on-danger: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151719;
        --surface: #1e2125;
        --surface-muted: #252a2f;
        --text: #eef1f4;
        --muted: #a8b0ba;
        --border: #3b424a;
        --primary: #68a4ff;
        --success: #58bd91;
        --danger: #ed756d;
        --on-danger: #18202a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      letter-spacing: 0;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    main { width: min(1040px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 40px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 22px; font-weight: 650; }
    h2 { margin: 0; font-size: 15px; font-weight: 650; }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); }
    .status[data-active="true"] .dot { background: var(--success); }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .metric { min-width: 0; padding: 16px; border-right: 1px solid var(--border); }
    .metric:last-child { border-right: 0; }
    .label { color: var(--muted); font-size: 12px; }
    .value { margin-top: 4px; overflow-wrap: anywhere; font-weight: 650; font-variant-numeric: tabular-nums; }
    section { margin-top: 16px; padding: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    button {
      min-height: 34px;
      padding: 0 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }
    button.primary { color: #fff; background: var(--primary); border-color: var(--primary); }
    button.danger { color: var(--on-danger); background: var(--danger); border-color: var(--danger); }
    button:disabled { cursor: default; opacity: .5; }
    dialog {
      width: min(440px, calc(100% - 32px)); max-height: calc(100% - 32px);
      margin: auto; padding: 20px; color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; overflow: auto;
    }
    dialog::backdrop { background: rgb(0 0 0 / .4); }
    dialog h2 { font-size: 16px; }
    .confirmation-message { margin: 12px 0 20px; overflow-wrap: anywhere; }
    .confirmation-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .network-form { display: flex; gap: 8px; }
    input { min-width: 0; height: 36px; padding: 0 10px; color: var(--text); background: var(--surface-muted); border: 1px solid var(--border); border-radius: 6px; }
    .network-form input { flex: 1; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { padding: 11px 8px; text-align: left; border-top: 1px solid var(--border); overflow-wrap: anywhere; }
    th { color: var(--muted); font-size: 12px; font-weight: 550; }
    th:nth-child(2) { width: 150px; }
    th:nth-child(3) { width: 72px; }
    th:nth-child(4) { width: 88px; }
    th:nth-child(5) { width: 150px; }
    th:nth-child(6) { width: 164px; }
    td code { font: 12px/18px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .device-actions { width: 52px; text-align: right; }
    .delete-device { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; color: var(--danger); }
    .delete-device:not(:disabled):hover { background: var(--surface-muted); border-color: var(--danger); }
    .connection { color: var(--muted); }
    .connection[data-state="connected"] { color: var(--success); }
    .empty { padding: 20px 8px; color: var(--muted); text-align: center; }
    .error { min-height: 20px; margin-top: 10px; color: var(--danger); overflow-wrap: anywhere; }
    #statusError:empty { display: none; }
    .access-denied {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 72px 24px;
      text-align: center;
      color: var(--muted);
    }
    .access-denied svg { margin-bottom: 16px; }
    .access-denied h1 { margin: 0 0 8px; font-size: 20px; font-weight: 650; color: var(--text); }
    .access-denied p { margin: 0; color: var(--muted); }
    @media (max-width: 900px) {
      table, thead, tbody, tr, th, td { display: block; }
      thead { display: none; }
      tr { padding: 10px 0; border-top: 1px solid var(--border); }
      td { padding: 3px 8px; border: 0; }
      .device-actions { width: auto; text-align: left; padding-top: 8px; }
    }
    @media (max-width: 720px) {
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric:nth-child(2) { border-right: 0; }
      .metric:nth-child(n+3) { border-top: 1px solid var(--border); }
      .network-form { flex-direction: column; }
      .network-form input { flex: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="access-denied" id="accessDenied" hidden>
    <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <h1>权限不足</h1>
    <p>该页面仅管理员可以访问。请使用管理员账号登录后重试。</p>
  </div>
  <main id="mainPanel">
    <header>
      <h1>FnCPN</h1>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">正在读取</span></div>
    </header>
    <div class="summary">
      <div class="metric"><div class="label">接口</div><div class="value" id="interface">-</div></div>
      <div class="metric"><div class="label">Overlay</div><div class="value" id="overlay">-</div></div>
      <div class="metric"><div class="label">监听端口</div><div class="value" id="port">-</div></div>
      <div class="metric"><div class="label">设备</div><div class="value" id="count">0</div></div>
    </div>
    <div class="error" id="statusError" role="alert"></div>
    <section>
      <div class="section-head">
        <h2>网络</h2>
        <span class="label" id="networkState">正在读取</span>
      </div>
      <form class="network-form" id="networkForm">
        <input id="overlayInput" aria-label="Overlay CIDR" placeholder="10.253.203.0/24" required>
        <input id="portInput" aria-label="UDP 监听端口" type="number" min="1" max="65535" required>
        <input id="lanInput" aria-label="LAN CIDRs" placeholder="192.168.1.0/24">
        <button class="primary" type="submit">应用网段</button>
      </form>
      <div class="error" id="networkError"></div>
    </section>
    <section>
      <div class="section-head">
        <h2>设备</h2>
        <button type="button" id="refresh" title="刷新">刷新</button>
      </div>
      <table>
        <thead><tr><th>名称</th><th>地址</th><th>启用</th><th>连接</th><th>流量</th><th>最近握手</th><th class="device-actions">操作</th></tr></thead>
        <tbody id="devices"></tbody>
      </table>
      <div class="empty" id="empty">暂无设备</div>
      <div class="error" id="deviceError" role="alert"></div>
    </section>
  </main>
  <dialog id="confirmation" aria-labelledby="confirmationTitle" aria-describedby="confirmationMessage">
    <h2 id="confirmationTitle"></h2>
    <p class="confirmation-message" id="confirmationMessage"></p>
    <div class="confirmation-actions">
      <button type="button" id="confirmationCancel">取消</button>
      <button type="button" id="confirmationAccept"></button>
    </div>
  </dialog>
  <script>
    const root = location.pathname.startsWith('/app/fncpn') ? '/app/fncpn' : '';
    const byId = id => document.getElementById(id);
    let currentOverlay = '';
    let snapshotCursor = '';
    let watchController = null;
    let formInitialized = false;
    let currentDevices = [];
    let devicesFresh = false;
    let deletingDeviceId = null;
    let snapshotEpoch = 0;
    let resolveConfirmation = null;
    let confirmationFocus = null;
    /*
      Lucide trash-2 (lucide-static 1.50.0), ISC License.
      Copyright (c) 2026 Lucide Icons and Contributors
      Permission to use, copy, modify, and/or distribute this software for any
      purpose with or without fee is hereby granted, provided that the above
      copyright notice and this permission notice appear in all copies.
      THE SOFTWARE IS PROVIDED "AS IS" AND THE AUTHOR DISCLAIMS ALL WARRANTIES
      WITH REGARD TO THIS SOFTWARE INCLUDING ALL IMPLIED WARRANTIES OF
      MERCHANTABILITY AND FITNESS. IN NO EVENT SHALL THE AUTHOR BE LIABLE FOR
      ANY SPECIAL, DIRECT, INDIRECT, OR CONSEQUENTIAL DAMAGES OR ANY DAMAGES
      WHATSOEVER RESULTING FROM LOSS OF USE, DATA OR PROFITS, WHETHER IN AN
      ACTION OF CONTRACT, NEGLIGENCE OR OTHER TORTIOUS ACTION, ARISING OUT OF
      OR IN CONNECTION WITH THE USE OR PERFORMANCE OF THIS SOFTWARE.

      Derived from Feather, MIT License. Copyright (c) 2013-present Cole Bemis
      Permission is hereby granted, free of charge, to any person obtaining a copy
      of this software and associated documentation files (the "Software"), to deal
      in the Software without restriction, including without limitation the rights
      to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
      copies of the Software, and to permit persons to whom the Software is
      furnished to do so, subject to the following conditions:
      The above copyright notice and this permission notice shall be included in
      all copies or substantial portions of the Software.
      THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
      IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
      FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
      AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
      LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
      OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN
      THE SOFTWARE.
    */
    const deleteIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 11v6"/><path d="M14 11v6"/>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
      <path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    </svg>`;
    // Native confirm() can be suppressed by the NAS desktop's iframe sandbox.
    function requestConfirmation(title, message, acceptLabel) {
      if (resolveConfirmation) return Promise.resolve(false);
      const dialog = byId('confirmation');
      byId('confirmationTitle').textContent = title;
      byId('confirmationMessage').textContent = message;
      byId('confirmationAccept').textContent = acceptLabel;
      byId('confirmationAccept').className = 'danger';
      confirmationFocus = document.activeElement;
      dialog.returnValue = 'cancel';
      dialog.showModal();
      byId('confirmationCancel').focus();
      return new Promise(resolve => { resolveConfirmation = resolve; });
    }
    byId('confirmationCancel').addEventListener('click', () => byId('confirmation').close('cancel'));
    byId('confirmationAccept').addEventListener('click', () => byId('confirmation').close('confirm'));
    byId('confirmation').addEventListener('close', () => {
      const resolve = resolveConfirmation;
      resolveConfirmation = null;
      const focus = confirmationFocus?.isConnected ? confirmationFocus : byId('refresh');
      confirmationFocus = null;
      focus.focus();
      resolve?.(byId('confirmation').returnValue === 'confirm');
    });
    function describeFailure(error) {
      if (!error) return '';
      return [
        error.code, error.message, error.operation && `[${error.operation}]`,
        error.httpStatus && `HTTP ${error.httpStatus}`,
        error.remoteCode && `remote ${error.remoteCode}`,
        error.detail, error.requestId && `request ${error.requestId}`
      ].filter(Boolean).join(': ');
    }
    async function responseValue(response) {
      if (!response.ok) {
        let message = `HTTP ${response.status}`;
        try { message = describeFailure((await response.json()).error) || message; } catch (_) {}
        throw new Error(message);
      }
      if (response.status === 204) return null;
      try { return await response.json(); } catch (_) {
        throw new Error(`PROTOCOL_ERROR: HTTP ${response.status}: invalid JSON response`);
      }
    }
    async function api(path, options = {}) {
      const response = await fetch(root + path, {
        ...options,
        headers: {'Content-Type': 'application/json', ...(options.headers || {})}
      });
      return responseValue(response);
    }
    async function fetchSnapshot(cursor = '', signal) {
      const epoch = snapshotEpoch;
      const query = new URLSearchParams({watch: '1'});
      if (cursor) query.set('after', cursor);
      const response = await fetch(
        root + '/api/v1/admin/snapshot?' + query,
        {signal}
      );
      const result = await responseValue(response);
      if (signal?.aborted || epoch !== snapshotEpoch) return null;
      if (!result.cursor) throw new Error('PROTOCOL_ERROR: invalid watch cursor');
      snapshotCursor = result.cursor;
      return result.changed ? result.snapshot : null;
    }
    async function refresh() {
      const epoch = snapshotEpoch;
      byId('deviceError').textContent = '';
      try {
        const snapshot = await fetchSnapshot();
        if (snapshot) renderSnapshot(snapshot);
      } catch (error) {
        if (epoch !== snapshotEpoch) return;
        markDevicesUnavailable();
        byId('deviceError').textContent = error.message;
      }
    }
    function markDevicesUnavailable() {
      devicesFresh = false;
      byId('status').dataset.active = 'false';
      byId('statusText').textContent = '读取失败';
      renderDevices(currentDevices);
    }
    function showAccessDenied() {
      watchController?.abort();
      byId('mainPanel').hidden = true;
      byId('accessDenied').hidden = false;
    }
    function fillNetworkForm(settings) {
      byId('overlayInput').value = settings.overlayCIDR;
      byId('portInput').value = settings.listenPort;
      byId('lanInput').value = (settings.lanCIDRs || []).join(', ');
      formInitialized = true;
    }
    function renderSnapshot(snapshot) {
        const active = Boolean(snapshot.network?.fresh && snapshot.network?.network?.active &&
          !snapshot.network?.network?.degraded);
        byId('status').dataset.active = String(active);
        byId('statusText').textContent = active ? '运行中' : '不可用';
        byId('interface').textContent = snapshot.network?.network?.interface || '-';
        byId('overlay').textContent = snapshot.settings.overlayCIDR;
        if (!formInitialized) {
          fillNetworkForm(snapshot.settings);
          byId('networkState').textContent = '已读取';
        }
        byId('port').textContent = snapshot.settings.listenPort;
        currentOverlay = snapshot.settings.overlayCIDR;
        const devices = snapshot.devices || [];
        currentDevices = devices;
        devicesFresh = active;
        byId('count').textContent = devices.length;
        renderDevices(devices);
        byId('statusError').textContent = describeFailure(
          snapshot.network?.lastError || snapshot.network?.network?.lastError
        );
    }
    async function watchChanges() {
      if (document.hidden || deletingDeviceId !== null) return;
      watchController?.abort();
      watchController = new AbortController();
      const controller = watchController;
      while (!document.hidden && controller === watchController) {
        try {
          const snapshot = await fetchSnapshot(snapshotCursor, controller.signal);
          if (controller.signal.aborted || controller !== watchController) return;
          if (snapshot) renderSnapshot(snapshot);
        } catch (error) {
          if (error.name === 'AbortError' || controller.signal.aborted) return;
          markDevicesUnavailable();
          byId('statusError').textContent = error.message;
          await new Promise(resolve => setTimeout(resolve, 1000));
        }
      }
    }
    function renderDevices(devices) {
      byId('empty').hidden = devices.length !== 0;
      byId('devices').replaceChildren(...devices.map(device => {
        const row = document.createElement('tr');
        const name = document.createElement('td');
        name.textContent = device.name;
        const address = document.createElement('td');
        const code = document.createElement('code');
        code.textContent = device.overlayAddress;
        address.append(code);
        const state = document.createElement('td');
        state.textContent = device.enabled ? '已启用' : '已停用';
        const connection = document.createElement('td');
        const connectionState = devicesFresh ? device.connectionState : 'unknown';
        connection.className = 'connection';
        connection.dataset.state = connectionState;
        connection.textContent = deletingDeviceId === device.id ? '删除中' :
          ({connected: '在线', disconnected: '离线', unknown: '状态未知'}[connectionState] || '状态未知');
        const traffic = document.createElement('td');
        traffic.textContent = `${formatBytes(device.receiveBytes)} / ${formatBytes(device.transmitBytes)}`;
        const handshake = document.createElement('td');
        handshake.textContent = device.lastHandshake
          ? new Date(device.lastHandshake).toLocaleString()
          : '-';
        const actions = document.createElement('td');
        actions.className = 'device-actions';
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'delete-device';
        remove.innerHTML = deleteIcon;
        remove.disabled = deletingDeviceId !== null || connectionState !== 'disconnected';
        remove.title = deletingDeviceId === device.id ? '正在删除' :
          ({connected: '设备在线，不能删除', disconnected: '删除设备', unknown: '状态未知，不能删除'}[connectionState] || '状态未知，不能删除');
        remove.setAttribute('aria-label', `删除 ${device.name} (${device.overlayAddress})`);
        remove.setAttribute('aria-busy', String(deletingDeviceId === device.id));
        remove.addEventListener('click', () => deleteDevice(device.id));
        actions.append(remove);
        row.append(name, address, state, connection, traffic, handshake, actions);
        return row;
      }));
    }
    async function deleteDevice(id) {
      const device = currentDevices.find(item => item.id === id);
      if (!device || !devicesFresh || device.connectionState !== 'disconnected' || deletingDeviceId !== null) return;
      byId('deviceError').textContent = '';
      try {
        if (!await requestConfirmation('删除设备',
          `删除设备“${device.name}”（${device.overlayAddress}）？此操作会移除该设备的注册记录和隧道配置。`, '删除')) return;
      } catch (error) {
        byId('deviceError').textContent = `无法打开确认框：${error.message}`;
        return;
      }
      const current = currentDevices.find(item => item.id === id);
      if (!current || !devicesFresh || current.connectionState !== 'disconnected' || deletingDeviceId !== null) {
        byId('deviceError').textContent = !current ? '设备已不存在，已取消删除。' :
          current.connectionState === 'connected' ? '设备已上线，已取消删除。' : '设备状态不可确认，已取消删除。';
        return;
      }
      deletingDeviceId = id;
      snapshotEpoch++;
      watchController?.abort();
      byId('refresh').disabled = true;
      byId('deviceError').textContent = '';
      renderDevices(currentDevices);
      let failure = '';
      try {
        await api('/api/v1/admin/devices/' + encodeURIComponent(id), {method: 'DELETE'});
        currentDevices = currentDevices.filter(item => item.id !== id);
        byId('count').textContent = currentDevices.length;
      } catch (error) {
        failure = error.message;
      } finally {
        snapshotEpoch++;
        await refresh();
        deletingDeviceId = null;
        byId('refresh').disabled = false;
        renderDevices(currentDevices);
        if (failure) byId('deviceError').textContent = failure;
        watchChanges();
      }
    }
    function formatBytes(value = 0) {
      if (value < 1024) return `${value} B`;
      if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KiB`;
      return `${(value / 1024 / 1024).toFixed(1)} MiB`;
    }
    byId('networkForm').addEventListener('submit', async event => {
      event.preventDefault();
      byId('networkError').textContent = '';
      const overlayCIDR = byId('overlayInput').value.trim();
      const controls = byId('networkForm').querySelectorAll('input, button');
      try {
        if (overlayCIDR !== currentOverlay &&
            !await requestConfirmation('修改 Overlay',
              '修改 Overlay 会重新分配全部设备地址并中断现有连接。继续吗？', '应用网段')) return;
        controls.forEach(control => { control.disabled = true; });
        byId('networkState').textContent = '正在应用';
        const state = await api('/api/v1/admin/networks', {
          method: 'PUT',
          body: JSON.stringify({
            overlayCIDR,
            listenPort: Number(byId('portInput').value),
            lanCIDRs: byId('lanInput').value.split(',').map(value => value.trim()).filter(Boolean)
          })
        });
        fillNetworkForm(state.settings);
        currentOverlay = state.settings.overlayCIDR;
        byId('networkState').textContent = '已应用';
        await refresh();
      } catch (error) {
        byId('networkState').textContent = '应用失败';
        byId('networkError').textContent = error.message;
      } finally {
        controls.forEach(control => { control.disabled = false; });
      }
    });
    byId('refresh').addEventListener('click', refresh);
    document.addEventListener('visibilitychange', async () => {
      if (document.hidden) {
        watchController?.abort();
        return;
      }
      await refresh();
      watchChanges();
    });
    // Identify the caller up front so non-admin users see a friendly notice
    // instead of a raw API permission error from /api/v1/admin/snapshot.
    async function boot() {
      try {
        const response = await fetch(root + '/api/v1/bootstrap');
        const body = await response.json().catch(() => null);
        if (response.ok && body && body.administrator === false) {
          showAccessDenied();
        } else {
          await refresh();
          watchChanges();
        }
      } catch (_) { await refresh(); watchChanges(); }
    }
    boot();
  </script>
</body>
</html>
